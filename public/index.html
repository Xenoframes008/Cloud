<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud · Starter App</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e8eefc;
        --muted: #9fb0d0;
        --accent: #6ea8fe;
        --ok: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 20% -10%, #1b2a52 0%, transparent 60%),
          radial-gradient(1000px 500px at 100% 0%, #123047 0%, transparent 55%),
          var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 720px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 40px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 12px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--ok); }
      h1 { font-size: 34px; margin: 18px 0 8px; letter-spacing: -0.02em; }
      p.lead { color: var(--muted); margin: 0 0 28px; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
      .tile {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.03);
      }
      .tile h3 { margin: 0 0 6px; font-size: 14px; color: var(--accent); }
      .tile pre { margin: 0; font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
      button {
        margin-top: 8px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #071227;
        font-weight: 600;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 14px;
      }
      button:hover { filter: brightness(1.05); }
      footer { margin-top: 26px; color: var(--muted); font-size: 12px; }
      code { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge"><span class="dot"></span> Environment online</span>
      <h1>Cloud</h1>
      <p class="lead">
        A minimal Node.js + Express starter application. This page confirms the
        development environment is running and can talk to the backend API.
      </p>

      <div class="grid">
        <div class="tile">
          <h3>GET /api/health</h3>
          <pre id="health">Loading…</pre>
        </div>
        <div class="tile">
          <h3>GET /api/info</h3>
          <pre id="info">Loading…</pre>
        </div>
      </div>

      <button id="refresh">Refresh</button>

      <footer>
        Try the API directly: <code>curl localhost:3000/api/health</code>
      </footer>
    </main>

    <script>
      async function load() {
        for (const [id, path] of [
          ["health", "/api/health"],
          ["info", "/api/info"],
        ]) {
          try {
            const res = await fetch(path);
            const data = await res.json();
            document.getElementById(id).textContent = JSON.stringify(data, null, 2);
          } catch (err) {
            document.getElementById(id).textContent = "Error: " + err.message;
          }
        }
      }
      document.getElementById("refresh").addEventListener("click", load);
      load();
    </script>
  </body>
</html>
